name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: wisej-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # The Modal CLI's Rich console output crashes under non-UTF-8 encodings.
  PYTHONIOENCODING: utf-8

jobs:
  deploy:
    name: Deploy preview
    # Secrets aren't exposed to pull_request runs from forks, so a fork PR
    # would fail at `modal deploy` with a confusing auth error. Skip instead.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal
        run: pip install --disable-pip-version-check modal

      # Two separate steps on purpose. The image build needs the repository;
      # the router must never touch it, because Modal re-imports the router
      # module inside a container where the repo doesn't exist. Publishing the
      # image under a name is what keeps the router a ~2s cold start instead of
      # resolving a multi-minute build on the request path.
      - name: Build and publish preview image
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: modal run deploy/preview/build_image.py

      - name: Deploy preview router
        id: deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          modal deploy deploy/preview/router.py 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.modal\.run' deploy.log | head -n1)
          if [ -z "$url" ]; then
            echo "::error::No *.modal.run URL found in the deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- wisej-preview -->'
          body=$(cat <<EOF
          $marker
          ### Wisej.NET Cloud preview

          **[Open preview]($URL)**

          Nothing is running until you open that link. The first request shows a
          progress screen while a container starts - about 10 seconds - then hands
          over to the app. It shuts down after 20 minutes with no traffic, and
          opening the link again brings it back. Everyone viewing this PR shares one
          instance, each with their own session.

          <sub>Built from \`${HEAD_SHA:0:7}\`</sub>
          EOF
          )
          body=$(printf '%s\n' "$body" | sed 's/^          //')

          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                 --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")

          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -f body="$body" > /dev/null
            echo "Updated comment $id"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" > /dev/null
            echo "Created preview comment"
          fi

  destroy:
    name: Tear down preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal
        run: pip install --disable-pip-version-check modal

      - name: Stop Modal apps
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # -y because there is no TTY here. Both apps are best-effort: a PR that
          # never deployed successfully has nothing to stop.
          modal app stop -y "wisej-demobrowser-pr-${PR}" \
            || echo "no router app for PR #${PR}"
          modal app stop -y "wisej-demobrowser-pr-${PR}-sandboxes" \
            || echo "no sandbox app for PR #${PR}"
